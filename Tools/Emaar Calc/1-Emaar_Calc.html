<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emaar Calc - Emaar Tools</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
<style>
:root{--primary:#0f4c81;--primary2:#1e3a8a;--gold:#d4af37;--bg:#f4f7f9;--surface:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header .ic{font-size:26px;}
header h1{font-size:19px;font-weight:600;}
header p{font-size:12px;opacity:.85;}
.back{margin-right:auto;color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:8px;font-size:13px;}
.back:hover{background:rgba(255,255,255,.3);}
main{flex:1;padding:20px;max-width:1100px;width:100%;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.btn{background:var(--primary);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--primary2);}
.btn.gold{background:var(--gold);color:#3b2f00;}
.btn.gray{background:#e2e8f0;color:var(--text);}
.btn.red{background:#ef4444;}
input[type=text],input[type=number],input[type=url],input[type=time],input[type=date],textarea,select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);width:100%;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);border-color:transparent;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
.row>*{flex:1;min-width:120px;}
.note{font-size:12px;color:var(--muted);margin-top:8px;}
h2{font-size:16px;margin-bottom:10px;color:var(--primary);}
</style>
</head>
<body>
<header>
<span class="ic">🧮</span>
<div><h1>Emaar Calc</h1><p>آلة حاسبة ومحول عملات</p></div>
<a class="back" href="../../index.html"><i class="ph ph-house"></i> الرئيسية</a>
</header>
<main>

<div class="card"><h2>الآلة الحاسبة</h2>
<input type="text" id="disp" readonly style="font-size:24px;text-align:left;direction:ltr;margin-bottom:10px;" value="0">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;" id="keys"></div></div>
<div class="card"><h2>محول العملات</h2>
<div class="row">
<div><label>المبلغ</label><input type="number" id="amt" value="100" oninput="conv()"></div>
<div><label>من</label><select id="from" onchange="conv()"></select></div>
<div><label>إلى</label><select id="to" onchange="conv()"></select></div>
<div><label>النتيجة</label><input type="text" id="res" readonly style="font-weight:700;"></div>
</div>
<p class="note">أسعار تقريبية ثابتة قابلة للتعديل بالأسفل (غير مرتبطة بالسوق المباشر).</p>
<div class="row" style="margin-top:10px;">
<div><label>1 دولار = ريال</label><input type="number" step="0.01" id="r_SAR" value="3.75" oninput="conv()"></div>
<div><label>1 دولار = جنيه مصري</label><input type="number" step="0.01" id="r_EGP" value="48.5" oninput="conv()"></div>
<div><label>1 دولار = درهم</label><input type="number" step="0.01" id="r_AED" value="3.67" oninput="conv()"></div>
<div><label>1 دولار = يورو</label><input type="number" step="0.001" id="r_EUR" value="0.92" oninput="conv()"></div>
</div></div>

</main>
<script>
const disp=document.getElementById('disp');let expr='';
const keys=['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','=','⌫'];
const kg=document.getElementById('keys');
keys.forEach(k=>{const b=document.createElement('button');b.className='btn '+(k==='='?'gold':'gray');b.style.justifyContent='center';b.style.fontSize='16px';b.textContent=k;b.onclick=()=>press(k);kg.appendChild(b);});
function press(k){if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){try{expr=String(Function('return('+expr.replace(/[^0-9+\-*/.() ]/g,'')+')')());}catch(e){expr='';disp.value='خطأ';return;}}else expr+=k;disp.value=expr||'0';}
const curs={USD:'دولار',SAR:'ريال',EGP:'جنيه مصري',AED:'درهم',EUR:'يورو'};
const f=document.getElementById('from'),t=document.getElementById('to');
Object.keys(curs).forEach(c=>{f.add(new Option(curs[c],c));t.add(new Option(curs[c],c));});
f.value='USD';t.value='SAR';
function rate(c){return c==='USD'?1:parseFloat(document.getElementById('r_'+c).value)||0;}
function conv(){const usd=parseFloat(document.getElementById('amt').value||0)/rate(f.value);document.getElementById('res').value=(usd*rate(t.value)).toFixed(2)+' '+curs[t.value];}
conv();
</script>
</body>
</html>
