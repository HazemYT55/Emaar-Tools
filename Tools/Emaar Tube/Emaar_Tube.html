<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emaar Tube - Emaar Tools</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
<style>
:root{--primary:#0f4c81;--primary2:#1e3a8a;--gold:#d4af37;--bg:#f4f7f9;--surface:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header .ic{font-size:26px;}
header h1{font-size:19px;font-weight:600;}
header p{font-size:12px;opacity:.85;}
.back{margin-right:auto;color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:8px;font-size:13px;}
.back:hover{background:rgba(255,255,255,.3);}
main{flex:1;padding:20px;max-width:1100px;width:100%;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.btn{background:var(--primary);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--primary2);}
.btn.gold{background:var(--gold);color:#3b2f00;}
.btn.gray{background:#e2e8f0;color:var(--text);}
.btn.red{background:#ef4444;}
input[type=text],input[type=number],input[type=url],input[type=time],input[type=date],textarea,select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);width:100%;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);border-color:transparent;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
.row>*{flex:1;min-width:120px;}
.note{font-size:12px;color:var(--muted);margin-top:8px;}
h2{font-size:16px;margin-bottom:10px;color:var(--primary);}
</style>
</head>
<body>
<header>
<span class="ic">🎥</span>
<div><h1>Emaar Tube</h1><p>مكتبة فيديو شخصية</p></div>
<a class="back" href="../../index.html"><i class="ph ph-house"></i> الرئيسية</a>
</header>
<main>

<div class="card"><h2>إضافة فيديو</h2>
<div class="row">
<div style="flex:2"><label>رابط فيديو (mp4 مباشر أو YouTube)</label><input type="url" id="vurl" placeholder="https://..."></div>
<div><label>العنوان</label><input type="text" id="vtitle" placeholder="اسم الفيديو"></div>
<div style="flex:0"><button class="btn" onclick="addV()"><i class="ph ph-plus"></i> إضافة</button></div>
</div></div>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;"></div>
<div id="player" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;justify-content:center;align-items:center;flex-direction:column;" onclick="if(event.target===this)closeP()">
<div id="pwrap" style="width:min(800px,92vw);"></div>
<button class="btn gray" style="margin-top:10px;" onclick="closeP()">إغلاق</button>
</div>

</main>
<script>
let vids=JSON.parse(localStorage.getItem('et_tube')||'[]');
function save(){localStorage.setItem('et_tube',JSON.stringify(vids));}
function ytId(u){const m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/);return m?m[1]:null;}
function addV(){const u=document.getElementById('vurl').value.trim();if(!u)return;
 vids.unshift({u,t:document.getElementById('vtitle').value.trim()||'فيديو'});
 document.getElementById('vurl').value='';document.getElementById('vtitle').value='';save();render();}
function render(){const g=document.getElementById('grid');g.innerHTML='';
 vids.forEach((v,i)=>{const d=document.createElement('div');d.className='card';d.style.margin='0';
  const y=ytId(v.u);
  const thumb=y?'<img src="https://img.youtube.com/vi/'+y+'/mqdefault.jpg" style="width:100%;border-radius:8px;cursor:pointer;" onclick="play('+i+')">'
    :'<div style="height:135px;background:#0f172a;border-radius:8px;display:flex;justify-content:center;align-items:center;cursor:pointer;" onclick="play('+i+')"><i class="ph ph-play-circle" style="font-size:48px;color:#fff;"></i></div>';
  d.innerHTML=thumb+'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;"><strong style="font-size:14px;">'+v.t+'</strong><button class="btn red" style="padding:4px 10px;" onclick="delV('+i+')">حذف</button></div>';
  g.appendChild(d);});
 if(!vids.length)g.innerHTML='<p class="note">المكتبة فارغة. أضف أول فيديو من الأعلى.</p>';}
function play(i){const v=vids[i],y=ytId(v.u),w=document.getElementById('pwrap');
 w.innerHTML=y?'<iframe width="100%" height="450" src="https://www.youtube.com/embed/'+y+'?autoplay=1" frameborder="0" allowfullscreen></iframe>'
  :'<video src="'+v.u+'" controls autoplay style="width:100%;max-height:70vh;background:#000;"></video>';
 document.getElementById('player').style.display='flex';}
function closeP(){document.getElementById('player').style.display='none';document.getElementById('pwrap').innerHTML='';}
function delV(i){vids.splice(i,1);save();render();}
render();
</script>
</body>
</html>
