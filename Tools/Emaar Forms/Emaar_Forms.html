<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emaar Forms - نماذج إعمار</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
  <style>
    :root {
      --primary: #0f4c81; --primary-light: #e0f2fe; --bg: #f4f7f9;
      --surface: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
      --border: #e2e8f0; --accent: #d4af37;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    
    .top-bar { background: var(--surface); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    
    .container { max-width: 800px; margin: 30px auto; width: 100%; padding: 0 20px; flex: 1; }
    
    .form-header { background: var(--surface); border-radius: 12px; padding: 25px; border-top: 8px solid var(--primary); margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .form-title { font-size: 28px; margin-bottom: 10px; border: none; outline: none; width: 100%; font-weight: 700; border-bottom: 2px solid transparent; transition: 0.2s; }
    .form-title:focus { border-bottom-color: var(--primary); }
    .form-desc { font-size: 14px; color: var(--text-muted); border: none; outline: none; width: 100%; resize: none; border-bottom: 2px solid transparent; transition: 0.2s; }
    .form-desc:focus { border-bottom-color: var(--border); }

    .question-card { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 15px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.03); border: 1px solid var(--border); }
    .q-input { font-size: 16px; font-weight: 600; border: none; outline: none; width: 100%; background: #f8fafc; padding: 10px; border-radius: 6px; margin-bottom: 15px; border-bottom: 1px solid transparent; }
    .q-input:focus { border-bottom-color: var(--primary); }

    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item { display: flex; align-items: center; gap: 10px; }
    .option-item input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .option-item input[type="text"] { border: none; border-bottom: 1px solid transparent; padding: 5px; outline: none; flex: 1; font-size: 14px; }
    .option-item input[type="text"]:focus { border-bottom-color: var(--border); }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Cairo'; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: #0d3f6b; }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .btn-danger { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 5px; }
    .btn-danger:hover { background: #fee2e2; }
    
    .floating-tools { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
    .delete-q { position: absolute; top: 15px; left: 15px; cursor: pointer; color: #ef4444; font-size: 20px; opacity: 0.5; transition: 0.2s; }
    .delete-q:hover { opacity: 1; }

    .add-opt { color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; display: inline-block; }
    
    @media (max-width: 600px) { .top-bar { flex-direction: column; gap: 10px; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <img src="../../assets/logo.jpg" alt="Emaar Logo" onerror="this.style.display='none'">
      نماذج إعمار (Emaar Forms) 📋
    </div>
    <button class="btn" onclick="saveForm()"><i class="ph ph-floppy-disk"></i> حفظ النموذج</button>
  </div>

  <div class="container">
    <div class="form-header">
      <input type="text" class="form-title" id="form-title" placeholder="عنوان النموذج" value="نموذج بدون عنوان">
      <textarea class="form-desc" id="form-desc" placeholder="وصف النموذج..." rows="2"></textarea>
    </div>

    <div id="questions-container"></div>

    <div class="floating-tools">
      <button class="btn btn-outline" onclick="addQuestion()"><i class="ph ph-plus"></i> إضافة سؤال</button>
    </div>
    
    <div style="text-align: center; padding-bottom: 40px;">
      <button class="btn" style="padding: 15px 40px; font-size: 16px;" onclick="previewForm()">معاينة النموذج</button>
    </div>
  </div>

  <script>
    let formData = {
      title: "نموذج بدون عنوان",
      desc: "",
      questions: []
    };

    function loadForm() {
      const saved = localStorage.getItem('emaarFormData');
      if (saved) {
        formData = JSON.parse(saved);
        document.getElementById('form-title').value = formData.title;
        document.getElementById('form-desc').value = formData.desc;
        renderQuestions();
      } else {
        addQuestion(); // Add first question if empty
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      formData.questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
          <i class="ph ph-trash delete-q" onclick="deleteQuestion(${index})" title="حذف السؤال"></i>
          <input type="text" class="q-input" placeholder="نص السؤال" value="${q.text}" oninput="updateQuestion(${index}, 'text', this.value)">
          <div class="options-list">
            ${q.options.map((opt, optIndex) => `
              <div class="option-item">
                <input type="radio" disabled>
                <input type="text" value="${opt}" placeholder="خيار ${optIndex + 1}" oninput="updateOption(${index}, ${optIndex}, this.value)">
              </div>
            `).join('')}
          </div>
          <span class="add-opt" onclick="addOption(${index})"><i class="ph ph-plus-circle"></i> إضافة خيار</span>
        `;
        container.appendChild(card);
      });
    }

    function addQuestion() {
      formData.questions.push({ text: "", options: ["الخيار 1"] });
      renderQuestions();
    }

    function deleteQuestion(index) {
      formData.questions.splice(index, 1);
      renderQuestions();
    }

    function updateQuestion(qIndex, field, value) {
      formData.questions[qIndex][field] = value;
    }

    function updateOption(qIndex, optIndex, value) {
      formData.questions[qIndex].options[optIndex] = value;
    }

    function addOption(qIndex) {
      formData.questions[qIndex].options.push("");
      renderQuestions();
    }

    document.getElementById('form-title').addEventListener('input', (e) => { formData.title = e.target.value; });
    document.getElementById('form-desc').addEventListener('input', (e) => { formData.desc = e.target.value; });

    function saveForm() {
      localStorage.setItem('emaarFormData', JSON.stringify(formData));
      alert('تم حفظ النموذج بنجاح! 💾');
    }

    function previewForm() {
      saveForm();
      alert('في المرحلة القادمة، سنقوم بإنشاء صفحة للمستخدمين لملء النموذج!');
    }

    window.onload = loadForm;
  </script>
</body>
</html>
