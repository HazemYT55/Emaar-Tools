<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emaar Forms - Emaar Tools</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
<style>
:root{--primary:#0f4c81;--primary2:#1e3a8a;--gold:#d4af37;--bg:#f4f7f9;--surface:#ffffff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header .ic{font-size:26px;}
header h1{font-size:19px;font-weight:600;}
header p{font-size:12px;opacity:.85;}
.back{margin-right:auto;color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:8px;font-size:13px;}
.back:hover{background:rgba(255,255,255,.3);}
main{flex:1;padding:20px;max-width:1100px;width:100%;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.btn{background:var(--primary);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--primary2);}
.btn.gold{background:var(--gold);color:#3b2f00;}
.btn.gray{background:#e2e8f0;color:var(--text);}
.btn.red{background:#ef4444;}
input[type=text],input[type=number],input[type=url],input[type=time],input[type=date],textarea,select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);width:100%;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);border-color:transparent;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
.row>*{flex:1;min-width:120px;}
.note{font-size:12px;color:var(--muted);margin-top:8px;}
h2{font-size:16px;margin-bottom:10px;color:var(--primary);}
</style>
</head>
<body>
<header>
<span class="ic">📋</span>
<div><h1>Emaar Forms</h1><p>إنشاء نماذج واستبيانات</p></div>
<a class="back" href="../../index.html"><i class="ph ph-house"></i> الرئيسية</a>
</header>
<main>

<div class="card"><h2>بناء النموذج</h2>
<div class="row">
<div style="flex:2"><label>نص السؤال</label><input type="text" id="qtext" placeholder="مثال: ما اسمك؟"></div>
<div><label>النوع</label><select id="qtype"><option value="text">نص قصير</option><option value="yesno">نعم / لا</option><option value="choice">اختيارات</option></select></div>
<div style="flex:0"><button class="btn" onclick="addQ()"><i class="ph ph-plus"></i> إضافة</button></div>
</div>
<div id="choicerow" style="display:none;margin-top:8px;"><label>الاختيارات (افصل بفاصلة)</label><input type="text" id="qopts" placeholder="ممتاز, جيد, مقبول"></div>
<div id="qlist" style="margin-top:14px;"></div></div>
<div class="card"><h2>معاينة وتعبئة</h2><div id="fill"></div>
<button class="btn gold" style="margin-top:12px;" onclick="exportAns()"><i class="ph ph-download-simple"></i> تصدير الإجابات JSON</button>
<p class="note">النموذج والإجابات تُحفظ على هذا الجهاز فقط (لا يوجد خادم لمشاركة النموذج).</p></div>

</main>
<script>
let qs=JSON.parse(localStorage.getItem('et_forms')||'[]');
document.getElementById('qtype').onchange=e=>document.getElementById('choicerow').style.display=e.target.value==='choice'?'block':'none';
function save(){localStorage.setItem('et_forms',JSON.stringify(qs));}
function addQ(){const t=document.getElementById('qtext').value.trim();if(!t)return;
 const ty=document.getElementById('qtype').value;
 const q={t,ty};if(ty==='choice')q.o=document.getElementById('qopts').value.split(',').map(s=>s.trim()).filter(Boolean);
 qs.push(q);document.getElementById('qtext').value='';save();render();}
function delQ(i){qs.splice(i,1);save();render();}
function render(){const l=document.getElementById('qlist');l.innerHTML='';
 qs.forEach((q,i)=>{const d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border);font-size:14px;';
  d.innerHTML='<span>'+(i+1)+'. '+q.t+' <span style="color:var(--muted)">('+({text:'نص',yesno:'نعم/لا',choice:'اختيارات'})[q.ty]+')</span></span>';
  const b=document.createElement('button');b.className='btn red';b.style.padding='4px 10px';b.textContent='حذف';b.onclick=()=>delQ(i);d.appendChild(b);l.appendChild(d);});
 const f=document.getElementById('fill');f.innerHTML='';
 qs.forEach((q,i)=>{const w=document.createElement('div');w.style.marginBottom='12px';
  w.innerHTML='<label>'+(i+1)+'. '+q.t+'</label>';
  if(q.ty==='text'){const inp=document.createElement('input');inp.type='text';inp.dataset.q=i;w.appendChild(inp);}
  else if(q.ty==='yesno'){w.innerHTML+='<label style="display:inline;margin-left:14px;"><input type="radio" name="q'+i+'" value="نعم"> نعم</label> <label style="display:inline;"><input type="radio" name="q'+i+'" value="لا"> لا</label>';}
  else{q.o.forEach(o=>{w.innerHTML+='<label style="display:block;"><input type="radio" name="q'+i+'" value="'+o+'"> '+o+'</label>';});}
  f.appendChild(w);});
 if(!qs.length)f.innerHTML='<p class="note">أضف أسئلة من الأعلى لبدء النموذج.</p>';}
function exportAns(){const ans=qs.map((q,i)=>{
 if(q.ty==='text')return document.querySelector('input[data-q=\''+i+'\']').value;
 const r=document.querySelector('input[name=q'+i+']:checked');return r?r.value:'';});
 const b=new Blob([JSON.stringify(qs.map((q,i)=>({q:q.t,a:ans[i]})),null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='اجابات.json';a.click();}
render();
</script>
</body>
</html>
