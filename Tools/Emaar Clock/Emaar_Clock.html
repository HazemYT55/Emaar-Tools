<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><title>Emaar Clock - الساعة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .clock { font-size: 80px; font-weight: 700; font-family: monospace; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .date { font-size: 20px; color: #94a3b8; margin-top: 10px; }
    .tabs { display: flex; gap: 10px; margin-top: 40px; }
    .tab { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-size: 16px; }
    .tab.active { background: #3b82f6; border-color: #3b82f6; }
    .tool-area { background: #1e293b; padding: 30px; border-radius: 16px; margin-top: 20px; width: 350px; text-align: center; border: 1px solid #334155; display: none; }
    .tool-area.active { display: block; }
    .time-display { font-size: 48px; font-family: monospace; margin-bottom: 20px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; margin: 5px; }
    .btn.red { background: #ef4444; }
    .btn.green { background: #22c55e; }
  </style>
</head>
<body>
  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('clock', this)">الساعة</button>
    <button class="tab" onclick="switchTab('stopwatch', this)">ساعة إيقاف</button>
    <button class="tab" onclick="switchTab('timer', this)">مؤقت</button>
  </div>

  <div class="tool-area" id="stopwatch-area">
    <div class="time-display" id="sw-display">00:00.00</div>
    <button class="btn green" id="sw-start" onclick="startStopwatch()">بدء</button>
    <button class="btn red" onclick="resetStopwatch()">تصفير</button>
  </div>

  <div class="tool-area" id="timer-area">
    <div class="time-display" id="timer-display">05:00</div>
    <button class="btn" onclick="startTimer()">بدء</button>
    <button class="btn red" onclick="resetTimer()">تصفير</button>
  </div>

  <script>
    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
      document.getElementById('date').innerText = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }, 1000);

    // Tabs
    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tool-area').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
      if (tab !== 'clock') document.getElementById(tab + '-area').classList.add('active');
    }

    // Stopwatch
    let swInterval, swTime = 0, swRunning = false;
    function startStopwatch() {
      if (swRunning) { clearInterval(swInterval); document.getElementById('sw-start').innerText = 'استئناف'; }
      else {
        const start = Date.now() - swTime;
        swInterval = setInterval(() => {
          swTime = Date.now() - start;
          const m = Math.floor(swTime / 60000).toString().padStart(2, '0');
          const s = Math.floor((swTime % 60000) / 1000).toString().padStart(2, '0');
          const ms = Math.floor((swTime % 1000) / 10).toString().padStart(2, '0');
          document.getElementById('sw-display').innerText = `${m}:${s}.${ms}`;
        }, 10);
        document.getElementById('sw-start').innerText = 'إيقاف';
      }
      swRunning = !swRunning;
    }
    function resetStopwatch() { clearInterval(swInterval); swRunning = false; swTime = 0; document.getElementById('sw-display').innerText = '00:00.00'; document.getElementById('sw-start').innerText = 'بدء'; }

    // Timer
    let timerInterval, timerTime = 300;
    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (timerTime <= 0) { clearInterval(timerInterval); timerInterval = null; alert('انتهى الوقت!'); return; }
        timerTime--;
        const m = Math.floor(timerTime / 60).toString().padStart(2, '0');
        const s = (timerTime % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
      }, 1000);
    }
    function resetTimer() { clearInterval(timerInterval); timerInterval = null; timerTime = 300; document.getElementById('timer-display').innerText = '05:00'; }
  </script>
</body>
</html>
