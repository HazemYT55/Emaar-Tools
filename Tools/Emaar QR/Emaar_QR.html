<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><title>Emaar QR - باركود</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --primary: #0f4c81; --bg: #f4f7f9; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; border-top: 8px solid var(--primary); }
    h1 { color: var(--primary); margin-bottom: 20px; }
    input { width: 100%; padding: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; font-size: 16px; margin-bottom: 15px; outline: none; }
    input:focus { border-color: var(--primary); }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 16px; width: 100%; margin-bottom: 20px; }
    .qr-box { display: flex; justify-content: center; align-items: center; padding: 20px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; min-height: 250px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 مولد الباركود (Emaar QR)</h1>
    <input type="text" id="qr-text" placeholder="أدخل رابطاً أو نصاً..." oninput="makeQR()" value="https://emaar-tools.web.app">
    <button class="btn" onclick="downloadQR()">تحميل الباركود</button>
    <div class="qr-box" id="qr-container"></div>
  </div>

  <script>
    let qrcode = new QRCode(document.getElementById("qr-container"), {
      text: document.getElementById('qr-text').value,
      width: 200,
      height: 200,
      colorDark : "#0f4c81",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    function makeQR() {
      const text = document.getElementById('qr-text').value;
      qrcode.clear();
      qrcode.makeCode(text || " ");
    }

    function downloadQR() {
      const img = document.querySelector('#qr-container img');
      if (!img) return alert('لا يوجد باركود لتحميله');
      const link = document.createElement('a');
      link.download = 'emaar_qr.png';
      link.href = img.src;
      link.click();
    }
  </script>
</body>
</html>
