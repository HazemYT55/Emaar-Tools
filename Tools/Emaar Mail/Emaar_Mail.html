<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emaar Mail - بريد إعمار</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
  
  <style>
    :root {
      --primary: #0f4c81; --primary-light: #e0f2fe; --bg: #f4f7f9;
      --surface: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
      --border: #e2e8f0; --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .top-bar { background: var(--surface); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    
    .btn-compose { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Cairo'; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-compose:hover { background: #0d3f6b; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(15,76,129,0.2); }

    .app-layout { display: flex; flex: 1; overflow: hidden; }
    
    /* SIDEBAR */
    .sidebar { width: 240px; background: var(--surface); border-left: 1px solid var(--border); padding: 15px; overflow-y: auto; }
    .folder-item { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: 0.2s; margin-bottom: 5px; }
    .folder-item:hover { background: #f1f5f9; }
    .folder-item.active { background: var(--primary-light); color: var(--primary); }
    .folder-item i { font-size: 18px; }

    /* EMAIL LIST */
    .email-list { width: 350px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }
    .email-row { padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 4px; }
    .email-row:hover { background: #f8fafc; }
    .email-row.active { background: var(--primary-light); border-right: 4px solid var(--primary); }
    .email-row.unread { font-weight: 700; background: #fff; }
    .email-sender { font-size: 14px; color: var(--text-main); display: flex; justify-content: space-between; }
    .email-time { font-size: 11px; color: var(--text-muted); font-weight: 400; }
    .email-subject { font-size: 13px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-snippet { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }

    /* READING PANE */
    .reading-pane { flex: 1; background: var(--surface); display: flex; flex-direction: column; overflow-y: auto; padding: 30px; position: relative; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
    .empty-state i { font-size: 64px; margin-bottom: 15px; color: #cbd5e1; }

    .mail-header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
    .mail-subject-large { font-size: 24px; font-weight: 700; margin-bottom: 15px; }
    .mail-info { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-muted); }
    .sender-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    .mail-body { font-size: 15px; line-height: 1.8; color: var(--text-main); white-space: pre-wrap; }

    .reply-box { margin-top: auto; border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
    .reply-box textarea { width: 100%; border: none; outline: none; resize: none; font-family: 'Cairo'; font-size: 14px; min-height: 80px; background: #f8fafc; padding: 10px; border-radius: 6px; }
    .btn-send { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; align-self: flex-start; transition: 0.2s; }
    .btn-send:hover { background: #0d3f6b; }

    /* COMPOSE MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--surface); border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 18px; color: var(--primary); }
    .modal-close { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 700; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Cairo'; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
    .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <img src="../../assets/logo.jpg" alt="Emaar Logo" onerror="this.style.display='none'">
      بريد إعمار (Emaar Mail) 📧
    </div>
    <button class="btn-compose" onclick="openComposeModal()"><i class="ph ph-pencil-simple"></i> إنشاء رسالة</button>
  </div>

  <div class="app-layout">
    
    <aside class="sidebar">
      <div class="folder-item active" onclick="switchFolder('inbox', this)">
        <i class="ph ph-tray"></i> صندوق الوارد
      </div>
      <div class="folder-item" onclick="switchFolder('sent', this)">
        <i class="ph ph-paper-plane-tilt"></i> المرسلة
      </div>
    </aside>

    <div class="email-list" id="email-list">
      <div class="empty-state" style="padding: 20px;"><div class="spinner" style="border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto;"></div></div>
    </div>

    <div class="reading-pane" id="reading-pane">
      <div class="empty-state">
        <i class="ph ph-envelope-open"></i>
        <p>اختر رسالة من القائمة لقراءتها.</p>
      </div>
    </div>

  </div>

  <!-- COMPOSE MODAL -->
  <div class="modal-overlay" id="compose-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>رسالة جديدة</h2>
        <button class="modal-close" onclick="closeComposeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>إلى (اختر المستخدم)</label>
          <select id="compose-to"></select>
        </div>
        <div class="form-group">
          <label>الموضوع</label>
          <input type="text" id="compose-subject" placeholder="موضوع الرسالة...">
        </div>
        <div class="form-group">
          <label>الرسالة</label>
          <textarea id="compose-body" rows="6" placeholder="اكتب رسالتك هنا..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-compose" style="background:transparent; color:var(--text-main); border: 1px solid var(--border);" onclick="closeComposeModal()">إلغاء</button>
        <button class="btn-compose" onclick="sendEmail()"><i class="ph ph-paper-plane-tilt"></i> إرسال</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, orderBy, onSnapshot, addDoc, serverTimestamp, doc, getDoc, getDocs 
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCx5lzS0B1QqqfuzOol5cYlzbecYhB9HoA",
      authDomain: "emaar-tools.firebaseapp.com",
      projectId: "emaar-tools",
      storageBucket: "emaar-tools.firebasestorage.app",
      messagingSenderId: "632274691084",
      appId: "1:632274691084:web:dbbdfd1fb570ade3b0fa29",
      measurementId: "G-FM7HLQEJ2H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentFolder = 'inbox';
    let unsubscribeEmails = null;
    let activeEmailId = null;

    // Auth Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "../../login.html"; return; }
      currentUser = user;
      loadInbox();
      loadUsersForCompose();
    });

    // Switch Folder
    window.switchFolder = function(folder, element) {
      currentFolder = folder;
      document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('reading-pane').innerHTML = `
        <div class="empty-state">
          <i class="ph ph-envelope-open"></i>
          <p>اختر رسالة من القائمة لقراءتها.</p>
        </div>
      `;
      activeEmailId = null;
      if (folder === 'inbox') loadInbox();
      else loadSent();
    }

    // Load Emails from Firestore
    function loadEmails(field, value) {
      if (unsubscribeEmails) unsubscribeEmails();
      
      const list = document.getElementById('email-list');
      list.innerHTML = '<div style="text-align:center; padding: 20px; color:var(--text-muted);">جاري التحميل...</div>';

      const q = query(
        collection(db, "emails"), 
        where(field, "==", value), 
        orderBy("createdAt", "desc")
      );

      unsubscribeEmails = onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
          list.innerHTML = '<div style="text-align:center; padding: 20px; color:var(--text-muted);">لا توجد رسائل هنا.</div>';
          return;
        }

        list.innerHTML = '';
        snapshot.forEach(docSnap => {
          const email = docSnap.data();
          const id = docSnap.id;
          
          const row = document.createElement('div');
          row.className = `email-row ${!email.read && field === 'toUid' ? 'unread' : ''} ${id === activeEmailId ? 'active' : ''}`;
          row.onclick = () => openEmail(id, email);
          
          const time = email.createdAt ? new Date(email.createdAt.toMillis()).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}) : '';
          const senderName = field === 'toUid' ? email.fromEmail : `إلى: ${email.toEmail}`;

          row.innerHTML = `
            <div class="email-sender">
              <span>${senderName}</span>
              <span class="email-time">${time}</span>
            </div>
            <div class="email-subject">${escapeHtml(email.subject)}</div>
            <div class="email-snippet">${escapeHtml(email.body)}</div>
          `;
          list.appendChild(row);
        });
      });
    }

    function loadInbox() { loadEmails("toUid", currentUser.uid); }
    function loadSent() { loadEmails("fromUid", currentUser.uid); }

    // Open Email Reading Pane
    window.openEmail = function(id, email) {
      activeEmailId = id;
      document.querySelectorAll('.email-row').forEach(el => el.classList.remove('active'));
      
      const pane = document.getElementById('reading-pane');
      const time = email.createdAt ? new Date(email.createdAt.toMillis()).toLocaleString('ar-EG') : '';
      
      pane.innerHTML = `
        <div class="mail-header">
          <div class="mail-subject-large">${escapeHtml(email.subject)}</div>
          <div class="mail-info">
            <div class="sender-avatar">${escapeHtml(email.fromEmail.charAt(0).toUpperCase())}</div>
            <div>
              <div style="font-weight:700; color: var(--text-main);">${escapeHtml(email.fromEmail)}</div>
              <div style="font-size:12px;">إلى: ${escapeHtml(email.toEmail)}</div>
            </div>
            <div style="margin-right:auto; font-size: 12px;">${time}</div>
          </div>
        </div>
        <div class="mail-body">${escapeHtml(email.body).replace(/\n/g, '<br>')}</div>
      `;
    }

    // Compose Email
    async function loadUsersForCompose() {
      const snap = await getDocs(collection(db, "users"));
      const select = document.getElementById('compose-to');
      select.innerHTML = '<option value="">اختر مستخدم...</option>';
      
      snap.forEach(d => {
        const u = d.data();
        if (d.id !== currentUser.uid) {
          select.innerHTML += `<option value="${d.id}" data-email="${u.email}">${u.email}</option>`;
        }
      });
    }

    window.openComposeModal = function() {
      document.getElementById('compose-modal').classList.add('active');
      document.getElementById('compose-subject').value = '';
      document.getElementById('compose-body').value = '';
    }

    window.closeComposeModal = function() {
      document.getElementById('compose-modal').classList.remove('active');
    }

    window.sendEmail = async function() {
      const toSelect = document.getElementById('compose-to');
      const toUid = toSelect.value;
      const toEmail = toSelect.options[toSelect.selectedIndex]?.getAttribute('data-email');
      const subject = document.getElementById('compose-subject').value.trim();
      const body = document.getElementById('compose-body').value.trim();

      if (!toUid || !subject || !body) {
        alert('يرجى ملء جميع الحقول.');
        return;
      }

      try {
        await addDoc(collection(db, "emails"), {
          fromUid: currentUser.uid,
          fromEmail: currentUser.email,
          toUid: toUid,
          toEmail: toEmail,
          subject: subject,
          body: body,
          read: false,
          createdAt: serverTimestamp()
        });
        closeComposeModal();
        alert('تم إرسال الرسالة بنجاح! 📧');
      } catch (e) {
        console.error(e);
        alert('حدث خطأ أثناء الإرسال. تأكد من إعدادات قاعدة البيانات.');
      }
    }

    // Helper
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

  </script>
</body>
</html>
