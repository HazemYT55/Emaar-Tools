<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><title>Emaar Pass - كلمات المرور</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
  <style>
    :root { --primary: #0f4c81; --bg: #f4f7f9; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; border-top: 8px solid var(--primary); }
    h1 { color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .pass-box { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; font-family: monospace; font-size: 24px; font-weight: bold; margin-bottom: 20px; word-break: break-all; color: #1e293b; position: relative; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 16px; width: 100%; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .options { text-align: right; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
    .option-row { display: flex; justify-content: space-between; align-items: center; }
    input[type="range"] { width: 200px; }
    .copy-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 20px; cursor: pointer; color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <h1><i class="ph ph-lock-key"></i> كلمات المرور (Emaar Pass)</h1>
    
    <div class="pass-box">
      <span id="password">اضغط توليد...</span>
      <button class="copy-btn" onclick="copyPass()" title="نسخ"><i class="ph ph-copy"></i></button>
    </div>

    <button class="btn" onclick="generate()"><i class="ph ph-arrows-clockwise"></i> توليد كلمة مرور جديدة</button>

    <div class="options">
      <div class="option-row">
        <label>طول كلمة المرور: <span id="len-val">16</span></label>
        <input type="range" id="length" min="8" max="64" value="16" oninput="document.getElementById('len-val').innerText = this.value">
      </div>
      <div class="option-row">
        <label>تضمين الأرقام (0-9)</label>
        <input type="checkbox" id="inc-numbers" checked>
      </div>
      <div class="option-row">
        <label>تضمين الرموز (!@#$)</label>
        <input type="checkbox" id="inc-symbols" checked>
      </div>
    </div>
  </div>

  <script>
    function generate() {
      const len = document.getElementById('length').value;
      const incNums = document.getElementById('inc-numbers').checked;
      const incSym = document.getElementById('inc-symbols').checked;

      let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (incNums) chars += "0123456789";
      if (incSym) chars += "!@#$%^&*()_+~`|}{[]:;?><,./-=";

      let pass = "";
      for (let i = 0; i < len; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      document.getElementById('password').innerText = pass;
    }

    function copyPass() {
      const pass = document.getElementById('password').innerText;
      if (pass === 'اضغط توليد...') return;
      navigator.clipboard.writeText(pass).then(() => {
        alert('تم نسخ كلمة المرور بنجاح! 📋');
      });
    }

    generate(); // Generate one on load
  </script>
</body>
</html>
