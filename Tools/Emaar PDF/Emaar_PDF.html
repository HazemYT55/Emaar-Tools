<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><title>Emaar PDF - محول الملفات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Using jsPDF library to generate PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root { --primary: #0f4c81; --bg: #f4f7f9; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; border-top: 8px solid var(--primary); }
    h1 { color: var(--primary); margin-bottom: 10px; }
    p { color: #64748b; margin-bottom: 20px; font-size: 14px; }
    .upload-area { border: 2px dashed #cbd5e1; padding: 40px 20px; border-radius: 8px; background: #f8fafc; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
    .upload-area:hover { border-color: var(--primary); background: #e0f2fe; }
    .upload-area i { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; font-size: 16px; width: 100%; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 صورة إلى PDF (Emaar PDF)</h1>
    <p>اختر صورة (JPG/PNG) وسنقوم بتحويلها إلى ملف PDF فوراً.</p>
    
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <div style="font-size: 40px;">🖼️</div>
      <div style="font-weight: 700; color: var(--primary);">اضغط لاختيار صورة</div>
    </div>
    
    <input type="file" id="file-input" accept="image/png, image/jpeg" style="display: none;" onchange="convertToPDF(this)">

    <button class="btn" id="download-btn" onclick="downloadPDF()">تحميل ملف PDF</button>
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    let pdfDoc = null;

    function convertToPDF(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Create PDF in A4 size (portrait, mm)
          pdfDoc = new jsPDF('p', 'mm', 'a4');
          const pageWidth = pdfDoc.internal.pageSize.getWidth();
          const pageHeight = pdfDoc.internal.pageSize.getHeight();

          // Calculate image dimensions to fit A4
          const imgRatio = img.width / img.height;
          let imgWidth = pageWidth - 20; // 10mm margin
          let imgHeight = imgWidth / imgRatio;

          if (imgHeight > pageHeight - 20) {
            imgHeight = pageHeight - 20;
            imgWidth = imgHeight * imgRatio;
          }

          const x = (pageWidth - imgWidth) / 2;
          const y = (pageHeight - imgHeight) / 2;

          pdfDoc.addImage(e.target.result, 'JPEG', x, y, imgWidth, imgHeight);
          
          document.getElementById('download-btn').style.display = 'block';
          document.querySelector('.upload-area').innerHTML = `<div style="font-size:40px;">✅</div><div style="font-weight:700; color:#16a34a;">تم تجهيز الملف!</div>`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function downloadPDF() {
      if (pdfDoc) {
        pdfDoc.save('Emaar_Document.pdf');
      }
    }
  </script>
</body>
</html>
